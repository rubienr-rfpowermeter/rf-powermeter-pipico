name: Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Formatting and linting
    runs-on: ubuntu-latest

    steps:
      - name: "repository: checkout"
        uses: actions/checkout@v6

      - name: "quality: prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install --yes parallel python3-venv shellcheck
          python3 -m venv "${RUNNER_TEMP}/clang-format"
          "${RUNNER_TEMP}/clang-format/bin/python" -m pip install \
            --disable-pip-version-check \
            clang-format==22.1.8
          echo "${RUNNER_TEMP}/clang-format/bin" >> "${GITHUB_PATH}"

      - name: "quality: C/C++ formatting"
        run: |
          clang-format --version
          src/scripts/auto-format.sh --check

      - name: "quality: shell scripts"
        run: |
          find src/scripts src/tests/unit/scripts \
            -type f -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck

      - name: "quality: GitHub Actions workflows"
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
